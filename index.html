<!DOCTYPE html>
<html lang="ka">
<head>
  <meta name="google-site-verification" content="iP5v15DdtP0RGU0H_HIVcxO023JVmcVnZE4_BJpf2Og" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MM-beauty line</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #faf6f1;
      --blush: #e8c4b8;
      --rose: #c9826b;
      --deep: #6b3d2e;
      --taupe: #a89080;
      --gold: #c4a882;
      --dark: #2a1a14;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--cream);
      color: var(--dark);
      font-family: 'Jost', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Decorative background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 80% 20%, rgba(232,196,184,0.35) 0%, transparent 70%),
        radial-gradient(ellipse 50% 60% at 10% 80%, rgba(201,130,107,0.15) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Header / Hero */
    header {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 24px 0;
    }

    .brand-ornament {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 24px;
      opacity: 0;
      animation: fadeUp 1s ease 0.2s forwards;
    }

    .ornament-line {
      width: 60px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold));
    }
    .ornament-line.right {
      background: linear-gradient(to left, transparent, var(--gold));
    }

    .ornament-diamond {
      width: 8px;
      height: 8px;
      background: var(--gold);
      transform: rotate(45deg);
    }

    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      font-weight: 300;
      letter-spacing: 0.12em;
      color: var(--deep);
      text-align: center;
      line-height: 1;
      opacity: 0;
      animation: fadeUp 1s ease 0.4s forwards;
    }

    .brand-name span {
      color: var(--rose);
      font-style: italic;
    }

    .brand-tagline {
      font-family: 'Jost', sans-serif;
      font-weight: 200;
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--taupe);
      margin-top: 10px;
      opacity: 0;
      animation: fadeUp 1s ease 0.6s forwards;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 48px auto;
      width: 100%;
      max-width: 500px;
      opacity: 0;
      animation: fadeUp 1s ease 0.8s forwards;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--blush), transparent);
    }

    .divider-icon {
      color: var(--rose);
      font-size: 1.1rem;
    }

    /* Main content */
    main {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    .welcome-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.1rem, 2.5vw, 1.5rem);
      font-weight: 400;
      line-height: 1.75;
      color: var(--deep);
      text-align: center;
      font-style: italic;
      margin-bottom: 56px;
      opacity: 0;
      animation: fadeUp 1s ease 1s forwards;
    }

    /* Contact cards */
    .contact-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .contact-card {
      background: rgba(255,255,255,0.65);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(232,196,184,0.5);
      border-radius: 2px;
      padding: 28px 36px;
      display: flex;
      align-items: center;
      gap: 24px;
      opacity: 0;
      transform: translateY(20px);
      transition: box-shadow 0.3s ease, transform 0.3s ease, border-color 0.3s ease;
      text-decoration: none;
      color: inherit;
    }

    .contact-card:nth-child(1) { animation: fadeUp 1s ease 1.2s forwards; }
    .contact-card:nth-child(2) { animation: fadeUp 1s ease 1.4s forwards; }
    .contact-card:nth-child(3) { animation: fadeUp 1s ease 1.6s forwards; }

    .contact-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(107,61,46,0.1);
      border-color: var(--rose);
    }

    .card-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blush), var(--rose));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card-icon svg {
      width: 22px;
      height: 22px;
      fill: white;
    }

    .card-content {
      flex: 1;
    }

    .card-label {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--taupe);
      margin-bottom: 6px;
    }

    .card-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      font-weight: 400;
      color: var(--deep);
      letter-spacing: 0.02em;
    }

    a.contact-card .card-value {
      color: var(--rose);
    }

    a.contact-card:hover .card-value {
      color: var(--deep);
    }

    /* CTA Button */
    .cta-wrap {
      margin-top: 52px;
      text-align: center;
      opacity: 0;
      animation: fadeUp 1s ease 1.8s forwards;
    }

    .cta-button {
      display: inline-block;
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 0.8rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: white;
      background: linear-gradient(135deg, var(--rose), var(--deep));
      border: none;
      padding: 18px 52px;
      cursor: pointer;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .cta-button::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--deep), var(--rose));
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .cta-button span {
      position: relative;
      z-index: 1;
    }

    .cta-button:hover::before { opacity: 1; }
    .cta-button:hover { transform: translateY(-2px); }

    /* Footer */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 32px 24px 40px;
      border-top: 1px solid rgba(232,196,184,0.4);
    }

    .footer-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      color: var(--taupe);
      letter-spacing: 0.2em;
      font-style: italic;
    }

    /* Keyframes */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 520px) {
      .contact-card { padding: 22px 20px; gap: 16px; }
      .card-value { font-size: 1.05rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-ornament">
      <div class="ornament-line"></div>
      <div class="ornament-diamond"></div>
      <div class="ornament-line right"></div>
    </div>

    <h1 class="brand-name">MM&#8202;<span>beauty</span>&#8202;line</h1>
    <p class="brand-tagline">Beauty &amp; Elegance</p>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-icon">✦</div>
      <div class="divider-line"></div>
    </div>
  </header>

  <main>
    <p class="welcome-text">
      მოგესალმებით MM-beauty line-ში,<br />
      შეგიძლიათ საკონტაქტო ინფორმაცია ნახოთ ქვემოთ
    </p>

    <div class="contact-grid">

      <!-- Phone -->
      <a class="contact-card" href="tel:571006400">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/>
          </svg>
        </div>
        <div class="card-content">
          <div class="card-label">ტელეფონის ნომერი</div>
          <div class="card-value">571 006 400</div>
        </div>
      </a>

      <!-- Facebook -->
      <a class="contact-card" href="https://www.facebook.com/share/1GSmsP2MmN/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </div>
        <div class="card-content">
          <div class="card-label">ფეისბუქ გვერდი</div>
          <div class="card-value">MM-beauty line</div>
        </div>
      </a>

      <!-- Address -->
      <div class="contact-card">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
        </div>
        <div class="card-content">
          <div class="card-label">მისამართი</div>
          <div class="card-value">17 შინდისელი გმირის ქუჩა</div>
        </div>
      </div>

    </div>

    <div class="cta-wrap">
      <a class="cta-button" href="tel:571006400">
        <span>დაგვიკავშირდით</span>
      </a>
    </div>
  </main>

  <footer>
    <p class="footer-brand">MM-beauty line &mdash; სილამაზე და ელეგანტურობა</p>
  </footer>

</body>
</html>
